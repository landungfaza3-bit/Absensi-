<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aplikasi Absensi Siswa</title>

    <style>

        body{
            margin:0;
            padding:0;
            font-family: Arial, sans-serif;

            /* Background biru */
            background: linear-gradient(to right, #007BFF, #00BFFF);

            height:100vh;
        }

        .container{

            width:400px;

            background:white;

            margin:auto;
            margin-top:40px;

            padding:20px;

            border-radius:15px;

            box-shadow:0px 0px 15px rgba(0,0,0,0.3);

            text-align:center;
        }

        /* Gambar */
        .gambar{
            width:120px;
            margin-bottom:10px;
        }

        h1{
            color:#007BFF;
        }

        input{

            width:100%;
            padding:12px;

            margin-top:10px;

            border-radius:5px;
            border:1px solid #ccc;

            box-sizing:border-box;
        }

        .button-group{

            display:flex;
            justify-content:space-between;

            margin-top:20px;
        }

        button{

            width:30%;

            padding:10px;

            border:none;

            border-radius:5px;

            color:white;

            cursor:pointer;

            font-weight:bold;
        }

        .hadir{
            background:green;
        }

        .izin{
            background:orange;
        }

        .alfa{
            background:red;
        }

        #hasil{

            margin-top:20px;

            background:#f0f0f0;

            padding:10px;

            border-radius:5px;

            text-align:left;
        }

        .card{

            background:white;

            padding:10px;

            margin-top:10px;

            border-radius:5px;

            box-shadow:0px 0px 5px gray;
        }

    </style>
</head>

<body>

    <div class="container">

        <!-- GAMBAR -->
        <img
            src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png"
            class="gambar"
        >

        <h1>ABSENSI SISWA</h1>

        <input
            type="text"
            id="nama"
            placeholder="Masukkan Nama Siswa"
        >

        <div class="button-group">

            <button
                class="hadir"
                onclick="absen('Hadir')"
            >
                Hadir
            </button>

            <button
                class="izin"
                onclick="absen('Izin')"
            >
                Izin
            </button>

            <button
                class="alfa"
                onclick="absen('Alfa')"
            >
                Alfa
            </button>

        </div>

        <div id="hasil"></div>

    </div>

    <script>

        let dataAbsensi = [];

        function absen(status){

            let nama =
                document.getElementById("nama").value;

            if(nama === ""){

                alert("Nama siswa harus diisi!");
                return;
            }

            dataAbsensi.push({

                nama:nama,
                status:status

            });

            tampilkanData();

            document.getElementById("nama").value = "";
        }

        function tampilkanData(){

            let hasil =
                document.getElementById("hasil");

            hasil.innerHTML = "";

            dataAbsensi.forEach(function(item){

                hasil.innerHTML += `

                    <div class="card">

                        <b>Nama :</b> ${item.nama}
                        <br>

                        <b>Status :</b> ${item.status}

                    </div>

                `;
            });
        }

    </script>

</body>
</html>
